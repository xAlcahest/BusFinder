name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a new query pack still gets a look at code nobody touched.
    - cron: "17 6 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: javascript-typescript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Code scanning is a public-repo feature on the free plan. Skipping rather
    # than failing keeps the check green while the repository is still private.
    if: ${{ !github.event.repository.private }}

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
