name: Feature request
description: Something the app should do and does not
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: A sketch is enough. If you have seen it done well elsewhere, say where.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This does not need fares, ticketing, or data from ATAC's own backend (those are out of scope)
          required: true
