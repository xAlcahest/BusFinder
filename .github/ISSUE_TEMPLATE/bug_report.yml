name: Bug report
description: Something in the app does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Most transit bugs only show up at one stop at one hour. The more of that you give us, the faster this goes.
  - type: input
    id: where
    attributes:
      label: Where
      description: The page, and the stop or line if there is one.
      placeholder: "/stop/70101 (Termini), line 64, around 18:30"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. ...
  - type: input
    id: env
    attributes:
      label: Browser and device
      placeholder: "Firefox 140 on Android 15, or Safari 18 on macOS"
  - type: dropdown
    id: language
    attributes:
      label: App language
      description: Only matters for text problems, but it helps for those.
      options: [Italiano, English, other (say which below)]
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, console errors, whether it happens every time.
